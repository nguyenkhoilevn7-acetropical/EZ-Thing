name: Postdeploy staging Chromium smoke
on:
  pull_request:
    paths:
      - 'tests/staging_browser_smoke.py'
      - '.github/workflows/postdeploy-staging-smoke.yml'
  workflow_dispatch:
jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify deployed demo with real browser
        run: timeout --signal=TERM 65s python -u tests/staging_browser_smoke.py
