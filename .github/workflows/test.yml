name: EZ Thing pilot tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Lint Python for syntax errors and undefined names
        run: ruff check app scripts migrations tests --select E9,F63,F7,F82
      - name: Check frontend JS syntax (every file, so new scripts are never skipped)
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done
      - name: Verify POS cart behavior
        run: node tests/node_pos_cart_feedback.cjs
      - name: Check print connector Python syntax
        run: python3 -m py_compile app/printing.py scripts/ez_print_connector.py
