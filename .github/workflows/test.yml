name: EZ Thing pilot tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Check frontend JS syntax
        run: |\n          node --check app/static/app.js\n          node --check app/static/customer.js\n          node --check app/static/admin.js\n          node --check app/static/sw.js
