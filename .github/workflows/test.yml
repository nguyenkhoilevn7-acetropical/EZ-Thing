name: EZ Thing pilot tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Check frontend JS syntax
        run: |
          node --check app/static/app.js
          node --check app/static/billing-ui.js
          node --check app/static/team-ui.js
          node --check app/static/site-publishing-ui.js
          node --check app/static/public-shop.js
          node --check app/static/customer.js
          node --check app/static/admin.js
          node --check app/static/reservations.js
          node --check app/static/merchant-restaurant-suite.js
          node --check app/static/operations-v5.js
          node --check app/static/merchant-modifiers.js
          node --check app/static/pos-v7.js
          node --check app/static/merchant-kds.js
          node --check app/static/merchant-print.js
          node --check app/static/merchant-print-documents.js
          node --check app/static/merchant-register.js
          node --check app/static/sw.js
      - name: Check print connector Python syntax
        run: python3 -m py_compile app/printing.py scripts/ez_print_connector.py
